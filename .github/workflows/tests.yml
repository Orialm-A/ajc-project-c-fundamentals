name: Unit tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Just
        run: sudo snap install just --classic

      - name: Build tests
        run: just utest-build

      - name: Run tests
        run: just utest-run
